[package]
name = "astry"
version = "0.26.0" # version.year.patch
edition = "2024"

authors = ["Censera <censera@proton.me>"]
description = "astry the programming language"
repository = "https://github.com/Censera/astry"

license-file = "LICENSE"
readme = "README.md"

keywords = ["compiler", "language"]
categories = ["command-line-utilities", "development-tools::compilers"]

[[bin]]
name = "astry"
path = "src/entry/main.rs"

[dependencies]

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
